name: Deploy validated automatic Hub execution
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-hub-enp-autovalidated.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - run: npm install --no-save acorn@8.15.0 acorn-walk@8.3.4 eslint-scope@8.4.0
      - name: Configure existing authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Pull and verify current source before patching
        run: |
          set -euo pipefail
          for D in PRE WORK FRESH POST; do
            mkdir -p "$D/src"
            printf '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$D/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          node repairs/hub-enp-automation-20261020/build.cjs PRE/src PRE/src/10_Central_Hub.js repairs/hub-enp-automation-20261020/native-overrides.js WORK/src/10_Central_Hub.js
          mv WORK/src/10_Central_Hub.js.receipt.json BUNDLE_RECEIPT.json
          node repairs/enp-search-empty-20261020/test.cjs WORK/src/10_Central_Hub.js
          node repairs/hub-enp-automation-20261020/test.cjs WORK/src
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - uses: actions/upload-artifact@v4
        with:
          name: hub-enp-automation-full-pre
          path: PRE
          retention-days: 30
      - name: Patch same project and verify complete source
        run: |
          set -euo pipefail
          rollback() { trap - ERR; clasp push --force --project PRE; exit 1; }
          trap rollback ERR
          clasp push --force --project WORK
          clasp pull --project POST
          diff -qr WORK/src POST/src
          node repairs/enp-search-empty-20261020/test.cjs POST/src/10_Central_Hub.js
          node repairs/hub-enp-automation-20261020/test.cjs POST/src
          find POST -type f -exec sha256sum {} + > POST_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-enp-automation-pre-post
          path: |
            PRE
            POST
            POST_SHA256.txt
            LEGACY
            WORK
            BUNDLE_RECEIPT.json
          retention-days: 30


      - name: Activate and verify the automatic timer
        id: activate
        continue-on-error: true
        run: |
          set -euo pipefail
          clasp run hub_enableEnternewpartAutomation --project WORK 2>&1 | tee activation-execution.txt
          node -e 'const fs=require("fs");const s=fs.readFileSync("activation-execution.txt","utf8");if(/unable to run|permission|not deployed|not found|script function.*failed/i.test(s)||!/\bINSTALLED\b/.test(s)){process.stderr.write("HUB_ENP_TIMER_NOT_ACTIVATED\n");process.exit(1);}process.stdout.write("HUB_ENP_TIMER_ACTIVATED_AND_VERIFIED\n");'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-enp-activation-result
          path: activation-execution.txt
          retention-days: 30
