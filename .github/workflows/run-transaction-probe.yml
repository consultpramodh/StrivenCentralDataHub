name: Run Transaction Endpoint Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-transaction-probe.yml"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure clasp auth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Run probe
        run: |
          set -euo pipefail
          SCRIPT_ID="$(tr -d '\r\n' < SCRIPT_ID.txt)"
          mkdir -p RUN
          cat > RUN/.clasp.json <<EOF
          {"scriptId":"$SCRIPT_ID"}
          EOF
          clasp run-function hub_probeTransactionEndpoints --project RUN --json > result.json
          node -e 'const r=require("./result.json"); if(r.error || !r.response || r.response.status !== "PASS") { console.error("Probe failed:", JSON.stringify(r)); process.exit(1); } console.log(JSON.stringify(r.response));'
