name: Audit Traeger Inventory Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-inventory-source.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure clasp auth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Pull Traeger Inventory Apps Script
        run: |
          mkdir -p TRAEGER/src
          cat > TRAEGER/.clasp.json <<'EOF'
          {"scriptId":"1OUDzVUrWkH4nKZIL-XT44d1SJwbMkDPZdPzKHwop-CnX2b9DdcthcSeR","rootDir":"src"}
          EOF
          clasp pull --project TRAEGER
      - name: Show inventory source evidence
        run: |
          echo "=== FILES ==="
          find TRAEGER/src -maxdepth 1 -type f -printf '%f\n' | sort
          echo "=== MATCHES ==="
          grep -RniE -C 8 'InventoryByLocation|QtyonHand|QtyOnHand|QtyOnSO|fetchStrivenReportRows_|pullStrivenReport_Items_ToSheet_RESUMABLE|api\.striven\.com/v2/reports|inventory' TRAEGER/src || true
