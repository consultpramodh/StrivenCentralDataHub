name: ENTERNEWPART one-row create and replace test
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up live project and prepare temporary read-only probe
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          cat >> WORK/src/ENTERNEWPART.js <<'JS'

          function hub_enpReportReadOnlyProbe() {
            const sheet=SpreadsheetApp.getActive().getSheetByName('ENTERNEWPART');
            const h=sheet.getRange(1,1,1,sheet.getLastColumn()).getValues()[0];
            const row=sheet.getRange(67,1,1,h.length).getValues()[0],v=k=>row[h.indexOf(k)];
            if(String(v('Item Number')).trim()!=='N010-1083-SER'||String(v('SO Internal ID')).trim()!=='28164'||v('Workflow Status')!=='HOLD'||Number(v('Cost'))!==136||Number(v('Discount'))!==0.5||Number(v('SO Line Price'))!==272)
              return {status:'ROW_CHANGED_STOPPED'};
            const props=PropertiesService.getScriptProperties();
            const lease=props.getProperty('HUB_ENP_WORKER_LEASE');
            if(lease){try{if(JSON.parse(lease).until>Date.now())return {status:'WORKER_BUSY_STOPPED'};}catch(e){return {status:'WORKER_LEASE_INVALID'};}}
            sheet.getRange(67,h.indexOf('Workflow Status')+1).setValue('NEEDS REVIEW');
            SpreadsheetApp.flush();
            try {
              return hub_row2LegacyEngine_().enp_hubExecuteRow_(67);
            } catch(err) {
              return {status:'BLOCKED',reason:String(err.message||err).slice(0,600)};
            }
          }
          JS
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - uses: actions/upload-artifact@v4
        with:
          name: enp-report-probe-pre
          path: PRE/src/
          retention-days: 30
      - name: Refresh queue and restore original source
        env:
          REPORT_URL: ${{ secrets.HUB_ENP_REPORT_URL }}
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          PARAMS=$(python3 -c 'import json,os; print(json.dumps([os.environ["REPORT_URL"]]))')
          clasp run hub_enpReportReadOnlyProbe --params "$PARAMS" --project WORK | tee report-probe.txt
          if grep -qiE 'unable to run|permission|not deployed|not found|script function.*failed' report-probe.txt; then exit 1; fi
          grep -q 'status' report-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enp-report-probe-results
          path: report-probe.txt
          retention-days: 7
          if-no-files-found: warn
