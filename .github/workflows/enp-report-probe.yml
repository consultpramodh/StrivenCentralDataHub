name: ENTERNEWPART guarded candidate processing
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up live project and prepare temporary read-only probe
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          cat >> WORK/src/ENTERNEWPART.js <<'JS'

          function hub_enpReportReadOnlyProbe() {
            const sheet=SpreadsheetApp.getActive().getSheetByName('ENTERNEWPART'),engine=hub_row2LegacyEngine_();
            const expected=[[3,'PRPRD2','27391'],[11,'PVW47','23829'],[18,'482-917','23283'],[28,'SF-32-K','23174'],[29,'CVR36','23174'],[30,'GG-20R','23174'],[31,'4BVK','23141']];
            const p=PropertiesService.getScriptProperties(),gate=LockService.getScriptLock();
            if(!gate.tryLock(5000))return {status:'WORKER_BUSY'};
            const leaseKey='HUB_ENP_WORKER_LEASE',token=Utilities.getUuid();
            try{
              const old=p.getProperty(leaseKey);if(old&&JSON.parse(old).until>Date.now())return {status:'WORKER_BUSY'};
              p.setProperty(leaseKey,JSON.stringify({token:token,until:Date.now()+5*60*1000}));
            }finally{gate.releaseLock();}
            const out=[];
            try {
              expected.forEach(function(spec){
                const grid=sheet.getDataRange().getValues(),h=grid[0],row=grid[spec[0]-1],v=k=>row[h.indexOf(k)];
                if(String(v('Item Number')).trim()!==spec[1]||String(v('SO Internal ID')).trim()!==spec[2]){out.push({row:spec[0],status:'ROW_CHANGED'});return;}
                if(v('Striven Item ID')){out.push({row:spec[0],status:'HAS_ITEM_ID_SKIP'});return;}
                try{engine.enp_hubAutomaticPlan_(grid,spec[0]);}catch(e){out.push({row:spec[0],status:'REVIEW',reason:String(e.message||e).slice(0,250)});return;}
                try{
                  const result=engine.enp_hubExecuteRow_(spec[0]);
                  out.push({row:spec[0],status:result.status,itemId:result.itemId||null});
                }catch(e){out.push({row:spec[0],status:'BLOCKED',reason:String(e.message||e).slice(0,400)});}
              });
              return {status:'BATCH_TEST_FINISHED',results:out};
            }finally{
              const raw=p.getProperty(leaseKey);
              if(raw&&JSON.parse(raw).token===token)p.deleteProperty(leaseKey);
            }
          }
          JS
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - uses: actions/upload-artifact@v4
        with:
          name: enp-report-probe-pre
          path: PRE/src/
          retention-days: 30
      - name: Refresh queue and restore original source
        env:
          REPORT_URL: ${{ secrets.HUB_ENP_REPORT_URL }}
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          PARAMS=$(python3 -c 'import json,os; print(json.dumps([os.environ["REPORT_URL"]]))')
          clasp run hub_enpReportReadOnlyProbe --params "$PARAMS" --project WORK | tee report-probe.txt
          if grep -qiE 'unable to run|permission|not deployed|not found|script function.*failed' report-probe.txt; then exit 1; fi
          grep -q 'status' report-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enp-report-probe-results
          path: report-probe.txt
          retention-days: 7
          if-no-files-found: warn
