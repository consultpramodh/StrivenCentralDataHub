name: ENTERNEWPART guarded item-group bridge test
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up live project and prepare temporary read-only probe
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          test "$(git hash-object PRE/src/ENTERNEWPART.js)" = "2810880e95165d66348dc92d9b177816f06d7fb2"
          test "$(git hash-object repairs/enternewpart-consolidation-20261028/ENTERNEWPART.js)" = "4753b2aaf360b9e0a023caff58ded66293960011"
          cp repairs/enternewpart-consolidation-20261028/ENTERNEWPART.js WORK/src/ENTERNEWPART.js
          node repairs/hub-enp-automation-20261020/test.cjs WORK/src
          node repairs/enp-search-empty-20261020/test.cjs WORK/src/10_Central_Hub.js
          cat >> WORK/src/ENTERNEWPART.js <<'JS'

          function hub_enpReportReadOnlyProbe() {
            const sh=SpreadsheetApp.openById('13OKw69We9tsIWzEQwNOl4aAHh11qrsICSOt781O2upU').getSheetByName('ENTERNEWPART');
            const e=hub_row2LegacyEngine_(),p=PropertiesService.getScriptProperties(),gate=LockService.getScriptLock();
            const key='HUB_ENP_WORKER_LEASE',token=Utilities.getUuid();
            if(!gate.tryLock(5000))return {status:'WORKER_BUSY'};
            try{
              const old=p.getProperty(key);if(old&&JSON.parse(old).until>Date.now())return {status:'WORKER_BUSY'};
              p.setProperty(key,JSON.stringify({token:token,until:Date.now()+5*60*1000}));
            }finally{gate.releaseLock();}
            let original=null, result='NOT_ATTEMPTED', reason='';
            try{
              const grid=sh.getDataRange().getValues(),h=grid[0],row=grid[69],v=k=>row[h.indexOf(k)];
              if(String(v('Item Number')).trim()!=='SPAPLENUM-4'||String(v('SO Internal ID')).trim()!=='28132'||
                 Number(v('Quantity'))!==1||Number(v('SO Line Price'))!==224||Number(v('Striven Item ID'))!==43467||
                 String(v('Workflow Status')).toUpperCase()==='COMPLETED')return {status:'ROW_CHANGED'};
              const so=e.enp_getSalesOrder_(28132),lines=e.enp_getSalesOrderLineItems_(so);
              const plans=e.enp_prepareItemGroupMasterBridgePlans_(28132,lines,{});
              if(plans.length!==1||plans[0].parentItemId!==42686)return {status:'GROUP_SCOPE_CHANGED',ids:plans.map(x=>x.parentItemId).join(',')};
              original=plans[0].originalPayload;
              try{
                e.enp_hubAutomaticPlan_(grid,70);
                const r=e.enp_hubExecuteRow_(70);
                result=r.status;reason=JSON.stringify(r);
              }catch(err){result='BLOCKED';reason=String(err.message||err).slice(0,700);}
              try{
                const keys=Object.keys(p.getProperties()).filter(k=>k.indexOf(e.enp_itemGroupBridgeRecoveryPrefix_())===0);
                if(keys.length)e.enp_recoverItemGroupMasterBridgeWatchdog();
                const live=e.enp_getStrivenItemById_(42686,{});
                e.enp_verifyItemGroupMasterPayload_(live,original,'Final restoration check');
                const remaining=Object.keys(p.getProperties()).filter(k=>k.indexOf(e.enp_itemGroupBridgeRecoveryPrefix_())===0);
                if(remaining.length)throw new Error('Recovery journal remains');
                return {status:'MASTER_RESTORED',orderResult:result,detail:reason};
              }catch(err){
                p.setProperty('HUB_ENP_AUTOMATION_ENABLED','false');
                return {status:'MASTER_RECOVERY_NEEDED',orderResult:result,detail:reason,recoveryError:String(err.message||err).slice(0,500)};
              }
            }finally{
              const raw=p.getProperty(key);
              if(raw&&JSON.parse(raw).token===token)p.deleteProperty(key);
            }
          }
          JS
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - uses: actions/upload-artifact@v4
        with:
          name: enp-report-probe-pre
          path: PRE/src/
          retention-days: 30
      - name: Refresh queue and restore original source
        env:
          REPORT_URL: ${{ secrets.HUB_ENP_REPORT_URL }}
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            if ! grep -q 'MASTER_RESTORED' report-probe.txt; then echo 'Recovery not verified: leaving patched source in place for watchdog'; return 1; fi
            clasp pull --project VERIFY
            diff -qr WORK/src VERIFY/src || { echo 'Live source changed during run; refusing to overwrite'; return 1; }
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          PARAMS=$(python3 -c 'import json,os; print(json.dumps([os.environ["REPORT_URL"]]))')
          clasp run hub_enpReportReadOnlyProbe --params "$PARAMS" --project WORK | tee report-probe.txt
          if grep -qiE 'unable to run|permission|not deployed|not found|script function.*failed' report-probe.txt; then exit 1; fi
          grep -q 'status' report-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enp-report-probe-results
          path: report-probe.txt
          retention-days: 7
          if-no-files-found: warn
