name: Inspect inventory report schema safely
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up and prepare read-only schema probe
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          cat >> WORK/src/ENTERNEWPART.js <<'JS'
          
          function hub_probeInventoryReportSchema() {
            const before=hub_refreshEnternewpartReport(),e=hub_row2LegacyEngine_(),book=e.enp_guardHubBook_(),sh=book.getSheetByName('ENTERNEWPART');
            const grid=sh.getDataRange().getValues(),h=e.enp_indexByHeader_(grid[0]),so=e.enp_getSalesOrder_(28177),cur=so.currency||so.Currency||{};
            if(String(cur.currencyISOCode||cur.CurrencyISOCode)!=='CAD')throw Error('Order currency not verified CAD');
            const witness=e.enp_legacyLiveItem_(23241),vendor=witness.preferredVendor||witness.PreferredVendor||{},maker=witness.manufacturer||witness.Manufacturer||{};
            if(Number(vendor.id||vendor.Id)!==51978||Number(maker.id||maker.Id)!==51978)throw Error('Supplier account witness changed');
            const rules=book.getSheetByName('ENP_VENDOR_RULES').getDataRange().getValues(),matches=rules.slice(1).filter(r=>String(r[1]).trim()==='Urban Hearth'&&!String(r[2]||'').trim());
            if(matches.length!==1||Number(matches[0][3])!==0.4)throw Error('Urban Hearth discount rule ambiguous');
            const category={'CSK-25':'Hearth - Gas - Insert','CXS-BB900':'Hearth - Accessories','CK25-RSF':'Hearth - Accessories','CK25-22536':'Hearth - Accessories'},changed=[];
            for(const rowNum of before.activeRows){
              const r=grid[rowNum-1],sku=String(r[h['Item Number']]||'').toUpperCase();
              if(!category[sku]||Number(r[h['SO Internal ID']])!==28177)continue;
              const state=e.enp_guardUpper_(r[h['Workflow Status']]);if(e.enp_hubIsHeld_(state))continue;
              const values={'Preferred Vendor':'Urban Hearth','Manufacturer':'Urban Hearth','Item Category':category[sku],'Currency':'CAD','Discount':0.4};
              Object.keys(values).forEach(k=>{if(h[k]==null)throw Error('Missing header '+k);const existing=r[h[k]];if(existing!==''&&existing!=null&&String(existing)!==String(values[k]))throw Error('Existing value conflicts: '+k);});
              Object.keys(values).forEach(k=>{const cell=sh.getRange(rowNum,h[k]+1);if(r[h[k]]===''||r[h[k]]==null)cell.setValue(values[k]).setNote(k==='Manufacturer'?'Supplier account used as manufacturer, consistent with existing Urban Hearth catalog item 23241.':k==='Currency'?'Verified from live sales order 586442.':'Kozy Heat supplied by Urban Hearth; category from reported product; discount from ENP_VENDOR_RULES.');});
              changed.push({row:rowNum,sku:sku});
            }
            SpreadsheetApp.flush();
            const out=hub_row2LegacyEngine_().enp_hubRunEligibleRows_(before.activeRows);
            const after=hub_refreshEnternewpartReport();
            return JSON.stringify({status:'ENRICHED',changed:changed,worker:out,remaining:after.reportRows,activeRows:after.activeRows});
          }
          JS
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - name: Inspect report and restore source
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            clasp pull --project VERIFY
            diff -qr WORK/src VERIFY/src || { echo 'Live source changed; refusing overwrite'; return 1; }
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          clasp run hub_probeInventoryReportSchema --project WORK | tee probe.txt
          grep -q 'status' probe.txt
