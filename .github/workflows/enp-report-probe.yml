name: ENTERNEWPART verify plenum and sales orders
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up live project and prepare temporary read-only probe
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          cat >> WORK/src/ENTERNEWPART.js <<'JS'

          function hub_enpReportReadOnlyProbe() {
            const e=hub_row2LegacyEngine_(),out=[];
            for(const path of ['/Help/Api/POST-v1-items','/Help/Api/PUT-v1-items-id','/Help/Api/POST-v1-Items']){
              try {
                const res=UrlFetchApp.fetch('https://api.striven.com'+path,{muteHttpExceptions:true});
                const text=res.getContentText().replace(/<[^>]*>/g,' ').replace(/\\s+/g,' ');
                out.push({path:path,code:res.getResponseCode(),text:text.slice(0,1000)});
              }catch(err){out.push({path:path,error:String(err.message||err).slice(0,200)});}
            }
            try{
              const m=e.enp_getStrivenItemById_(42686,{});
              const children=m.groupItems||m.GroupItems||[];
              for(const id of [28132,28125]){
                const so=e.enp_getSalesOrder_(id),lines=e.enp_getSalesOrderLineItems_(so);
                const groups=lines.filter(l=>Number((l.item||l.Item||{}).id||(l.item||l.Item||{}).Id)===42686);
                out.push({order:id,groupCount:groups.length,masterChildren:children.length,orderChildren:groups.map(g=>(g.itemGroupLineItems||g.ItemGroupLineItems||[]).length).join(','),
                same:groups.map(g=>e.enp_itemGroupDefinitionSignature_(g.itemGroupLineItems||g.ItemGroupLineItems||[])===e.enp_itemGroupDefinitionSignature_(children)).join(',')});
              }
            }catch(err){out.push({group:'ERROR',reason:String(err.message||err).slice(0,300)});}
            return {status:'BRIDGE_READONLY_CHECK',results:out};
          }
          JS
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - uses: actions/upload-artifact@v4
        with:
          name: enp-report-probe-pre
          path: PRE/src/
          retention-days: 30
      - name: Refresh queue and restore original source
        env:
          REPORT_URL: ${{ secrets.HUB_ENP_REPORT_URL }}
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            clasp pull --project VERIFY
            diff -qr WORK/src VERIFY/src || { echo 'Live source changed during run; refusing to overwrite'; return 1; }
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          PARAMS=$(python3 -c 'import json,os; print(json.dumps([os.environ["REPORT_URL"]]))')
          clasp run hub_enpReportReadOnlyProbe --params "$PARAMS" --project WORK | tee report-probe.txt
          if grep -qiE 'unable to run|permission|not deployed|not found|script function.*failed' report-probe.txt; then exit 1; fi
          grep -q 'status' report-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enp-report-probe-results
          path: report-probe.txt
          retention-days: 7
          if-no-files-found: warn
