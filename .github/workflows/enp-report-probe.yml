name: Remove temporary property audit helper
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Remove only temporary audit helper
        run: |
          set -euo pipefail
          for d in PRE WORK CHECK VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          git show dd6a1636ee5df73a970161ba0983dd38f66d9c6f > expected.js
          cmp expected.js PRE/src/ENTERNEWPART.js
          test -f PRE/src/TMP_PROPERTY_AUDIT.js
          grep -q '^function hub_oncePropertyKeyAudit()' PRE/src/TMP_PROPERTY_AUDIT.js
          cp -a PRE/src/. WORK/src/
          rm WORK/src/TMP_PROPERTY_AUDIT.js
          printf '\n' >> WORK/src/ENTERNEWPART.js
          clasp pull --project CHECK
          diff -qr PRE/src CHECK/src
          clasp push --force --project WORK
          clasp pull --project VERIFY
          diff -qr WORK/src VERIFY/src
          cp expected.js WORK/src/ENTERNEWPART.js
          rm -rf CHECK/src
          mkdir -p CHECK/src
          clasp pull --project CHECK
          diff -qr VERIFY/src CHECK/src
          clasp push --force --project WORK
          rm -rf VERIFY/src
          mkdir -p VERIFY/src
          clasp pull --project VERIFY
          diff -qr WORK/src VERIFY/src
          test ! -f VERIFY/src/TMP_PROPERTY_AUDIT.js
          echo TEMPORARY_HELPER_REMOVED
