name: Inspect requested Apps Script project
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Pull and inspect source without executing it
        run: |
          set -euo pipefail
          mkdir -p TARGET/src
          printf '%s' '{"scriptId":"1kVwKBKX8DXCmjBXs4vjIRuyMD2lwMejAZEuVjvK6Yi6YRNCmqFlP9UhG","rootDir":"src"}' > TARGET/.clasp.json
          clasp pull --project TARGET
          python3 - <<'PY'
          import pathlib,re
          files=list(pathlib.Path('TARGET/src').rglob('*'))
          files=[p for p in files if p.is_file()]
          print('SOURCE_FILE_COUNT',len(files))
          for p in files:
              s=p.read_text(errors='replace')
              lines=s.splitlines()
              hits=[(i,l) for i,l in enumerate(lines,1) if re.search(r'serial|item.?import|import.?item|lot.?number',l,re.I)]
              if hits:
                  print('MATCH_FILE',p.name,'COUNT',len(hits))
                  for i,l in hits[:100]:
                      safe=re.sub(r'(["\x27\x60])(?:\\.|(?!\1).)*?\1','[STRING]',l)
                      print('LINE',i,safe[:250])
          PY
