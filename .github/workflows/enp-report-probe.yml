name: Inspect bridge mismatch during guarded retry
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up and prepare read-only schema probe
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          cat >> WORK/src/ENTERNEWPART.js <<'JS'
          
          function hub_probeInventoryReportSchema() {
            const report=hub_refreshEnternewpartReport();
            if(!report.activeRows.includes(69))return JSON.stringify({status:'NO_LONGER_ACTIVE'});
            const out=hub_row2LegacyEngine_().enp_hubRunEligibleRows_([69]);
            return JSON.stringify({status:'DIAGNOSTIC_RUN',result:out});
          }
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('WORK/src/ENTERNEWPART.js')
          s=p.read_text()
          old="label + ': Item Group child configuration did not read back as expected.'"
          new="label + ': Item Group child configuration did not read back as expected. LIVE=' + enp_itemGroupDefinitionSignature_(liveGroups) + ' EXPECTED=' + enp_itemGroupDefinitionSignature_(expectedGroups)"
          if s.count(old)!=1: raise SystemExit('Expected verification guard not found exactly once')
          p.write_text(s.replace(old,new))
          PY
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - name: Inspect report and restore source
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            clasp pull --project VERIFY
            diff -qr WORK/src VERIFY/src || { echo 'Live source changed; refusing overwrite'; return 1; }
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          clasp run hub_probeInventoryReportSchema --project WORK | tee probe.txt
          grep -q 'status' probe.txt
