name: Inspect inventory report schema safely
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up and prepare read-only schema probe
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          cat >> WORK/src/ENTERNEWPART.js <<'JS'
          
          function hub_probeInventoryReportSchema() {
            const before=hub_refreshEnternewpartReport(),e=hub_row2LegacyEngine_(),sh=e.enp_guardHubBook_().getSheetByName('ENTERNEWPART'),grid=sh.getDataRange().getValues(),h=e.enp_indexByHeader_(grid[0]);
            const rows=before.activeRows.filter(n=>e.enp_guardUpper_(grid[n-1][h['Item Number']])==='1TLMXXX05-10'&&Number(grid[n-1][h['SO Internal ID']])===28139);
            if(rows.length===1){
              const so=e.enp_getSalesOrder_(28139),currency=so.currency||so.Currency||{},code=String(currency.currencyISOCode||currency.CurrencyISOCode||'').toUpperCase();
              if(code==='CAD'&&String(grid[rows[0]-1][h.Currency]||'')==='')sh.getRange(rows[0],h.Currency+1).setValue('CAD').setNote('Verified from live sales order 586404.');
            }
            SpreadsheetApp.flush();
            const result=e.enp_hubRunEligibleRows_(before.activeRows),after=hub_refreshEnternewpartReport(),now=sh.getDataRange().getValues();
            return JSON.stringify({status:'DONE',worker:result,reportRows:after.reportRows,rows:after.activeRows.map(n=>({row:n,sku:now[n-1][h['Item Number']],reason:now[n-1][h['Review Reason']]})),completedStillInReport:after.completedStillInReport});
          }
          JS
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - name: Inspect report and restore source
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            clasp pull --project VERIFY
            diff -qr WORK/src VERIFY/src || { echo 'Live source changed; refusing overwrite'; return 1; }
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          clasp run hub_probeInventoryReportSchema --project WORK | tee probe.txt
          grep -q 'status' probe.txt
