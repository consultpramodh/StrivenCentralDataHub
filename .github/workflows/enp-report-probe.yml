name: One-time ENTERNEWPART queue refresh
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up live project and prepare temporary read-only probe
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          cat >> WORK/src/ENTERNEWPART.js <<'JS'

          function hub_enpReportReadOnlyProbe(url) {
            if(!/^https:\/\/api\.striven\.com\/v2\/reports\//i.test(String(url)))return {status:'INVALID_REPORT_URL'};
            const p=PropertiesService.getScriptProperties();
            const cid=p.getProperty('CLIENT_ID')||p.getProperty('STRIVEN_CLIENT_ID');
            const secret=p.getProperty('CLIENT_SECRET')||p.getProperty('STRIVEN_CLIENT_SECRET');
            if(!cid||!secret)return {status:'HUB_STRIVEN_CREDENTIALS_MISSING'};
            try{
              const token=hub_strivenAccessToken_(cid,secret).accessToken;
              const response=UrlFetchApp.fetch(String(url),{method:'get',headers:{Authorization:'Bearer '+token,Accept:'application/json'},muteHttpExceptions:true,followRedirects:false});
              const code=response.getResponseCode();
              if(code!==200)return {status:'HTTP_ERROR',httpCode:code};
              const body=JSON.parse(response.getContentText());
              const arrays=Array.isArray(body)?[body]:['rows','Rows','data','Data','Results','results'].filter(k=>Array.isArray(body[k])).map(k=>body[k]);
              if(arrays.length!==1)return {status:'UNKNOWN_ENVELOPE',topLevelKeys:Object.keys(body||{}).slice(0,30)};
              const rows=arrays[0],fields=rows.length&&rows[0]&&typeof rows[0]==='object'?Object.keys(rows[0]):[];
              const lock=LockService.getScriptLock();lock.waitLock(30000);
              try {
                const sh=SpreadsheetApp.getActive().getSheetByName('ENTERNEWPART'),grid=sh.getDataRange().getValues(),hdr=grid[0],idx={};
                hdr.forEach((h,i)=>{if(h)idx[String(h)]=i;});
                const required=['Item Number','Item Name','Price','Source','Sales Order Number','SO Internal ID','SO Status','Quantity','SO Line Price','Original Description','Workflow Status','Review Reason','Last Source Update'];
                required.forEach(h=>{if(idx[h]===undefined)throw new Error('MISSING_HEADER');});
                const norm=x=>String(x==null?'':x).trim().replace(/\r\n?/g,'\n');
                const numeric=x=>{const s=String(x==null?'':x).replace(/[$,\s]/g,'');return s!==''&&Number.isFinite(Number(s))?Number(s):null;};
                const key=(id,desc,qty,price)=>JSON.stringify([norm(id),norm(desc),numeric(qty),numeric(price)]);
                const seen=new Set(),existing=new Set();
                grid.slice(1).forEach(q=>{if(q[idx['SO Internal ID']]&&q[idx['Original Description']])existing.add(key(q[idx['SO Internal ID']],q[idx['Original Description']],q[idx.Quantity],q[idx['SO Line Price']]));});
                const candidates=[];
                rows.forEach(r=>{
                  const id=norm(r.SalesOrderSalesOrderId),desc=norm(r.ItemDescription),source=norm(r.SalesOrderStatus),qty=numeric(r.Quantity),price=numeric(r.Price);
                  if(!id||!desc||!['Approved','Quoted'].includes(source)||qty===null||price===null)throw new Error('INVALID_REPORT_ROW');
                  const k=key(id,desc,qty,price);if(seen.has(k))throw new Error('DUPLICATE_REPORT_IDENTITY');seen.add(k);
                  if(!existing.has(k))candidates.push({r:r,id:id,desc:desc,source:source,qty:qty,price:price,k:k});
                });
                const slots=[];
                for(let i=1;i<grid.length;i++){const q=grid[i];if(!q[idx['Item Number']]&&!q[idx.Source]&&!q[idx['Original Description']]&&!q[idx['SO Internal ID']])slots.push(i+1);}
                if(slots.length<candidates.length)throw new Error('INSUFFICIENT_BLANK_ROWS');
                let inserted=0;
                candidates.forEach((c,j)=>{
                  const row=slots[j],parsed=hub_descParseFields_(c.desc);
                  const safe=x=>typeof x==='string'&&/^[=+@-]/.test(x)?"'"+x:x;
                  sh.getRange(row,idx['Workflow Status']+1).setValue('HOLD');
                  const values={'Item Number':parsed.itemNumber,'Item Name':parsed.name,'Price':parsed.price===null?'':parsed.price,'Source':c.source,'Sales Order Number':c.r.SalesOrderNumber||'','SO Internal ID':c.id,'SO Status':c.source,'Quantity':c.qty,'SO Line Price':c.price,'Original Description':c.desc,'Review Reason':'New report request: verify item identity and required metadata.','Last Source Update':new Date()};
                  Object.keys(values).forEach(h=>sh.getRange(row,idx[h]+1).setValue(safe(values[h])));
                  sh.getRange(row,idx['Workflow Status']+1).setValue('NEEDS REVIEW');
                  SpreadsheetApp.flush();
                  if(norm(sh.getRange(row,idx['SO Internal ID']+1).getValue())!==c.id||norm(sh.getRange(row,idx['Original Description']+1).getValue())!==c.desc)throw new Error('INTAKE_READBACK_FAILED');
                  existing.add(c.k);inserted++;
                });
                return {status:'REFRESHED',reportRows:rows.length,inserted:inserted,alreadyPresent:rows.length-inserted,strivenWrites:0};
              } finally {lock.releaseLock();}
            }catch(e){return {status:'FETCH_OR_PARSE_ERROR',errorType:String(e.name||'Error')};}
          }
          JS
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - uses: actions/upload-artifact@v4
        with:
          name: enp-report-probe-pre
          path: PRE/src/
          retention-days: 30
      - name: Refresh queue and restore original source
        env:
          REPORT_URL: ${{ secrets.HUB_ENP_REPORT_URL }}
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          PARAMS=$(python3 -c 'import json,os; print(json.dumps([os.environ["REPORT_URL"]]))')
          clasp run hub_enpReportReadOnlyProbe --params "$PARAMS" --project WORK | tee report-probe.txt
          if grep -qiE 'unable to run|permission|not deployed|not found|script function.*failed' report-probe.txt; then exit 1; fi
          grep -q 'status' report-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enp-report-probe-results
          path: report-probe.txt
          retention-days: 7
          if-no-files-found: warn
