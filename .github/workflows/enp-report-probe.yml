name: Correct existing item line description once
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up source and prepare single-item helper
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          cat >> WORK/src/ENTERNEWPART.js <<'JS'

          function hub_onceReuseExistingAc01349() {
            const e=hub_row2LegacyEngine_(),sh=e.enp_guardHubBook_().getSheetByName('ENTERNEWPART'),grid=sh.getDataRange().getValues(),h=e.enp_indexByHeader_(grid[0]);
            const n=78,r=grid[n-1];if(e.enp_guardUpper_(r[h['Item Number']])!=='AC01349'||Number(r[h['SO Internal ID']])!==28139||Number(r[h['Striven Item ID']])!==36602)throw Error('Row identity changed');
            const parsed=e.enp_parseDescription_(r[h['Original Description']]);if(e.enp_guardUpper_(parsed.itemNumber)!=='AC01349'||!parsed.name)throw Error('Original description unavailable');
            const so=e.enp_getSalesOrder_(28139),status=so.status||so.Status||{};
            if(e.enp_guardUpper_(status.name||status.Name)!=='QUOTED'||String(so.orderNumber||so.OrderNumber)!=='586404')throw Error('Order identity or status changed');
            const target=e.enp_findTargetPlaceholderLine_(e.enp_getSalesOrderLineItems_(so),{desiredItemNumber:'AC01349',desiredQty:1,newItemId:36602});
            if(!target||Number((target.item||target.Item||{}).id||(target.item||target.Item||{}).Id)!==36602)throw Error('Expected existing item line not found');
            const lineId=e.enp_num_(target.id!=null?target.id:target.Id),qty=e.enp_verificationNumber_(target.qty!=null?target.qty:target.Qty),price=e.enp_verificationNumber_(target.price!=null?target.price:target.Price);
            if(qty!==1||price!==350)throw Error('Live line quantity or price changed');
            const result=e.enp_replaceSalesOrderItems_(28139,[{key:'HUB_ROW_'+n,lineId:lineId,desiredItemNumber:'AC01349',desiredItemName:parsed.name,desiredPrice:350,desiredQty:1,newItemId:36602}]);
            if(!result||result.blocked||!Array.isArray(result.replacements)||result.replacements.length!==1)throw Error('Description correction not verified');
            const after=hub_refreshEnternewpartReport();
            return JSON.stringify({status:'DESCRIPTION_CORRECTED',lineId:lineId,reportRows:after.reportRows,completedStillInReport:after.completedStillInReport});
          }
          JS
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - name: Run and restore source
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            clasp pull --project VERIFY
            diff -qr WORK/src VERIFY/src || { echo 'Live source changed; refusing overwrite'; return 1; }
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          clasp run hub_onceReuseExistingAc01349 --project WORK | tee probe.txt
          grep -q 'status' probe.txt
