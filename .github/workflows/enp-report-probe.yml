name: ENTERNEWPART single-row readiness test
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up live project and prepare temporary read-only probe
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          cat >> WORK/src/ENTERNEWPART.js <<'JS'

          function hub_enpReportReadOnlyProbe() {
            const sheet=SpreadsheetApp.getActive().getSheetByName('ENTERNEWPART');
            const header=sheet.getRange(1,1,1,sheet.getLastColumn()).getValues()[0];
            const row=sheet.getRange(67,1,1,header.length).getValues()[0];
            const v=k=>row[header.indexOf(k)];
            if(String(v('Item Number')).trim()!=='N010-1083-SER'||String(v('SO Internal ID')).trim()!=='28164')return {status:'ROW_CHANGED_STOPPED'};
            const e=hub_row2LegacyEngine_(),sku=String(v('Item Number')).trim();
            try {
              const item=e.enp_legacyExactLookupNow_(sku);
              const so=e.enp_getSalesOrder_(28164),lines=e.enp_getSalesOrderLineItems_(so);
              const target=e.enp_findTargetPlaceholderLine_(lines,{desiredItemNumber:sku,desiredQty:Number(v('Quantity')),newItemId:item?e.enp_guardItemId_(item):null});
              const missing=['Cost','Item Category','Preferred Vendor','Manufacturer'].filter(k=>v(k)===''||v(k)==null);
              return {status:'CHECKED',itemFound:!!item,itemId:item?e.enp_guardItemId_(item):null,lineFound:!!target,lineId:target?(target.id||target.Id):null,missingFields:missing,soStatus:v('SO Status'),soLinePrice:v('SO Line Price'),soCurrency:so.currency||so.Currency||null,soCurrencyId:so.currencyId||so.CurrencyId||null,referenceKeys:Object.keys(JSON.parse(PropertiesService.getScriptProperties().getProperty('ENTERNEWPART_HUB_REFERENCE_IDS')||'{}')),strivenWrites:0};
            }catch(err){return {status:'BLOCKED',reason:String(err.message||err).slice(0,300),strivenWrites:0};}
          }
          JS
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - uses: actions/upload-artifact@v4
        with:
          name: enp-report-probe-pre
          path: PRE/src/
          retention-days: 30
      - name: Refresh queue and restore original source
        env:
          REPORT_URL: ${{ secrets.HUB_ENP_REPORT_URL }}
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          PARAMS=$(python3 -c 'import json,os; print(json.dumps([os.environ["REPORT_URL"]]))')
          clasp run hub_enpReportReadOnlyProbe --params "$PARAMS" --project WORK | tee report-probe.txt
          if grep -qiE 'unable to run|permission|not deployed|not found|script function.*failed' report-probe.txt; then exit 1; fi
          grep -q 'status' report-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enp-report-probe-results
          path: report-probe.txt
          retention-days: 7
          if-no-files-found: warn
