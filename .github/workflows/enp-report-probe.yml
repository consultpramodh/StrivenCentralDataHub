name: Inspect requested Apps Script project
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Pull and inspect source without executing it
        run: |
          set -euo pipefail
          mkdir -p TARGET/src
          printf '%s' '{"scriptId":"1kVwKBKX8DXCmjBXs4vjIRuyMD2lwMejAZEuVjvK6Yi6YRNCmqFlP9UhG","rootDir":"src"}' > TARGET/.clasp.json
          clasp pull --project TARGET
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('TARGET/src/create_newitems.js')
          s=p.read_text(errors='replace')
          for i,l in enumerate(s.splitlines(),1):
              if re.search(r'SERIAL_TRACKING_POST_FIELD|UrlFetchApp|fetch\\(|enp_|function |/v[0-9]/items|serial|verif|readback|response|getContentText',l,re.I):
                  if re.search(r'(token|secret|password|authorization|bearer)',l,re.I):
                      print('LINE',i,'[sensitive line withheld]')
                  else:
                      print('LINE',i,l[:220])
          for p in pathlib.Path('TARGET/src').glob('*'):
              if p.is_file() and re.search(r'import|csv_export',p.name,re.I):
                  print('FILE',p.name)
                  for i,l in enumerate(p.read_text(errors='replace').splitlines(),1):
                      if re.search(r'function |UrlFetchApp|/v[0-9]/|import|serial',l,re.I):
                          if re.search(r'token|secret|password|authorization|bearer',l,re.I): continue
                          print('LINE',i,l[:180])
          PY
