name: ENTERNEWPART live report reconciliation probe
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up live project and prepare temporary read-only probe
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          cat >> WORK/src/ENTERNEWPART.js <<'JS'

          function hub_enpReportReadOnlyProbe(url) {
            const p=PropertiesService.getScriptProperties(),cid=p.getProperty('CLIENT_ID')||p.getProperty('STRIVEN_CLIENT_ID'),secret=p.getProperty('CLIENT_SECRET')||p.getProperty('STRIVEN_CLIENT_SECRET');
            if(!/^https:\/\/api\.striven\.com\/v2\/reports\//i.test(String(url))||!cid||!secret)return {status:'INVALID_CONFIGURATION'};
            const res=UrlFetchApp.fetch(String(url),{method:'get',headers:{Authorization:'Bearer '+hub_strivenAccessToken_(cid,secret).accessToken,Accept:'application/json'},muteHttpExceptions:true,followRedirects:false});
            if(res.getResponseCode()!==200)return {status:'REPORT_HTTP_ERROR',code:res.getResponseCode()};
            const body=JSON.parse(res.getContentText()),arrays=Array.isArray(body)?[body]:['rows','Rows','data','Data','Results','results'].filter(k=>Array.isArray(body[k])).map(k=>body[k]);
            if(arrays.length!==1)return {status:'UNKNOWN_REPORT_ENVELOPE'};
            const rows=arrays[0],out=[];
            for(const r of rows){
              const parsed=hub_descParseFields_(String(r.ItemDescription||''));
              out.push({order:String(r.SalesOrderNumber||''),soId:String(r.SalesOrderSalesOrderId||''),sku:parsed.itemNumber,status:String(r.SalesOrderStatus||''),qty:r.Quantity,price:r.Price});
            }
            const matches=Object.keys(p.getProperties()).filter(k=>p.getProperty(k)===String(url));
            return {status:'LIVE_REPORT_CHECKED',count:rows.length,items:JSON.stringify(out),matchingUrlPropertyNames:matches.join(',')};
          }
          JS
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - uses: actions/upload-artifact@v4
        with:
          name: enp-report-probe-pre
          path: PRE/src/
          retention-days: 30
      - name: Refresh queue and restore original source
        env:
          REPORT_URL: ${{ secrets.HUB_ENP_REPORT_URL }}
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            clasp pull --project VERIFY
            diff -qr WORK/src VERIFY/src || { echo 'Live source changed during run; refusing to overwrite'; return 1; }
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          PARAMS=$(python3 -c 'import json,os; print(json.dumps([os.environ["REPORT_URL"]]))')
          clasp run hub_enpReportReadOnlyProbe --params "$PARAMS" --project WORK | tee report-probe.txt
          if grep -qiE 'unable to run|permission|not deployed|not found|script function.*failed' report-probe.txt; then exit 1; fi
          grep -q 'status' report-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enp-report-probe-results
          path: report-probe.txt
          retention-days: 7
          if-no-files-found: warn
