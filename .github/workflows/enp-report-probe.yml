name: ENTERNEWPART verify plenum and sales orders
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Back up live project and prepare temporary read-only probe
        run: |
          set -euo pipefail
          for d in PRE WORK FRESH VERIFY; do
            mkdir -p "$d/src"
            printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > "$d/.clasp.json"
          done
          clasp pull --project PRE
          cp -a PRE/src/. WORK/src/
          cat >> WORK/src/ENTERNEWPART.js <<'JS'

          function hub_enpReportReadOnlyProbe() {
            const e=hub_row2LegacyEngine_(),out=[];
            try {
              const it=e.enp_legacyLiveItem_(43467);
              const rawCost=it.cost!==undefined?it.cost:it.Cost;
              out.push({type:'item',id:e.enp_guardItemId_(it),number:e.enp_guardItemNumber_(it),price:e.enp_guardItemPrice_(it),costPresent:rawCost!==undefined&&rawCost!==null,cost:rawCost===undefined?null:rawCost});
            }catch(err){out.push({type:'item',status:'ERROR',reason:String(err.message||err).slice(0,250)});}
            for(const spec of [[28132,143249],[28125,0]]){
              try {
                const so=e.enp_getSalesOrder_(spec[0]),lines=e.enp_getSalesOrderLineItems_(so);
                const found=lines.filter(l=>e.enp_lineDescriptionMatchesExactItemNumber_(String(l.description||l.Description||''),'SPAPLENUM-4'));
                out.push({type:'order',id:spec[0],lines:JSON.stringify(found.map(l=>({id:l.id||l.Id,itemId:(l.item||l.Item||{}).id||(l.item||l.Item||{}).Id,qty:l.qty||l.Qty,price:l.price!==undefined?l.price:l.Price})))});
              }catch(err){out.push({type:'order',id:spec[0],status:'ERROR',reason:String(err.message||err).slice(0,250)});}
            }
            return {status:'PLENUM_VERIFY_FINISHED',results:out};
          }
          JS
          node --check WORK/src/ENTERNEWPART.js
          clasp pull --project FRESH
          diff -qr PRE/src FRESH/src
      - uses: actions/upload-artifact@v4
        with:
          name: enp-report-probe-pre
          path: PRE/src/
          retention-days: 30
      - name: Refresh queue and restore original source
        env:
          REPORT_URL: ${{ secrets.HUB_ENP_REPORT_URL }}
        run: |
          set -euo pipefail
          restore() {
            trap - EXIT
            clasp pull --project VERIFY
            diff -qr WORK/src VERIFY/src || { echo 'Live source changed during run; refusing to overwrite'; return 1; }
            clasp push --force --project PRE
            clasp pull --project VERIFY
            diff -qr PRE/src VERIFY/src
          }
          trap restore EXIT
          clasp push --force --project WORK
          PARAMS=$(python3 -c 'import json,os; print(json.dumps([os.environ["REPORT_URL"]]))')
          clasp run hub_enpReportReadOnlyProbe --params "$PARAMS" --project WORK | tee report-probe.txt
          if grep -qiE 'unable to run|permission|not deployed|not found|script function.*failed' report-probe.txt; then exit 1; fi
          grep -q 'status' report-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enp-report-probe-results
          path: report-probe.txt
          retention-days: 7
          if-no-files-found: warn
