name: Inspect requested Apps Script project
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Pull and inspect source without executing it
        run: |
          set -euo pipefail
          mkdir -p TARGET/src
          printf '%s' '{"scriptId":"1kVwKBKX8DXCmjBXs4vjIRuyMD2lwMejAZEuVjvK6Yi6YRNCmqFlP9UhG","rootDir":"src"}' > TARGET/.clasp.json
          clasp pull --project TARGET
          python3 - <<'PY'
          import pathlib
          lines=pathlib.Path('TARGET/src/create_newitems.js').read_text().splitlines()
          for a,b in [(1,20),(98,132),(198,220)]:
              for i in range(a,b+1):
                  l=lines[i-1]
                  if any(w in l.lower() for w in ('token','secret','password','authorization','bearer')): continue
                  print('LINE',i,l[:200])
          PY
