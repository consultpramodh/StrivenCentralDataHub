name: Refresh DATA_ITEMS inventory catalog
on:
  push:
    branches: [work/enternewpart-consolidation-20261028]
    paths: ['.github/workflows/enp-report-probe.yml']
permissions:
  contents: read
concurrency:
  group: shared-item-resolver-deployment
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@3.3.0
      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.HUB_CLASPRC_JSON }}
        run: |
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Check live routine and refresh DATA_ITEMS
        run: |
          set -euo pipefail
          mkdir -p LIVE/src
          printf '%s' '{"scriptId":"1t81y0BcV0cnBEBSKcbZt2nx16IBAg63rRvsfSVpjiDiBvrNi6TEq-AG8","rootDir":"src"}' > LIVE/.clasp.json
          clasp pull --project LIVE
          git show e7331724e1faa8fe6eeb26583324af4fb473abec > expected.js
          node <<'NODE'
          const fs=require('fs'),a=fs.readFileSync('expected.js','utf8'),b=fs.readFileSync('LIVE/src/10_Central_Hub.js','utf8');
          const names=['hub_refreshStdItems','hub_stdItemsSchema_','hub_stdItemsHeaders_','hub_stdItemsFetchPage_','hub_stdItemsExtractRows_','hub_buildCanonicalSourceMap_','hub_writeCanonicalDataset_','hub_strivenAccessToken_','hub_reportPagedUrl_','hub_initializeOrRepair','hub_updateRefreshControl_','hub_apiUsage_','hub_log_','hub_limit_'];
          function extract(s,n) { let i=s.indexOf('function '+n+'('); if(i<0) return null; let j=s.indexOf('\nfunction ',i+1); return s.slice(i,j<0?s.length:j).trim(); }
          const mismatched=names.filter(n=>!extract(a,n)||extract(a,n)!==extract(b,n));
          if(mismatched.length){console.log('Changed or missing refresh functions:',mismatched.join(', '));process.exit(1);}
          console.log('Refresh functions match audited baseline');
          NODE
          clasp run hub_refreshStdItems --project LIVE
